name: Publication documentation checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify unchanged research sources and affiliation metadata
        run: python3 scripts/publication_release_audit.py
      - name: Verify the exact interactive demonstration and negative controls
        run: node tests/frontier_c3_browser_test.cjs
      - name: Assemble and check the publication site
        run: python3 scripts/independent_site.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: publication-documentation-evidence
          path: |
            results/publication-v1.1.2-audit.json
            build/independent-site/artifact-sha256.json
          if-no-files-found: error
