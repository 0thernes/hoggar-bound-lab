name: Conjecture E (all 9 cases), Kramers floor & saturation Lean 4 audit

on:
  push:
    paths:
      - "lean/HoggarBound/Kramers.lean"
      - "lean/HoggarBound/SaturationTheory.lean"
      - "lean/HoggarBound/ConjectureECore.lean"
      - "lean/HoggarBound/ConjectureECones.lean"
      - "lean/HoggarBound/ConjectureE.lean"
      - "lean/HoggarBound/ConjectureEExtras.lean"
      - "lean/HoggarBound/AuditUpgrades.lean"
      - "lean/HoggarBound/C3ExactOptimaData.lean"
      - "lean/HoggarBound/C3ExactOptima.lean"
      - "lean/HoggarBound/SaturatedPhaseSix.lean"
      - "lean/HoggarBound/NormPhaseFamily.lean"
      - "lean/HoggarBound/ExactDegreesN4N5.lean"
      - "lean/VerifyNewFormalizations.lean"
      - "scripts/conjecture_e_trace_formula.py"
      - "results/conjecture_e_trace_formula.json"
      - "results/conjecture_e_trace_formula_n6.json"
      - "scripts/c3_sdp_dual_check.py"
      - "results/c3_sdp_dual_check.json"
      - "scripts/c3_exact_optima_check.py"
      - "data/c3_exact_optima_certs.json"
      - "results/c3_exact_optima_check.json"
      - "scripts/norm_phase_family.py"
      - "data/flat/n6_det6.txt"
      - "results/norm_phase_family.json"
      - "scripts/exact_degrees_n4_n5.py"
      - "data/w52_orbits_42.tsv"
      - "data/q7minus_42_certs.json"
      - "results/exact_degrees_n4_n5.json"
      - ".github/workflows/conjecture-e-all-cases.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conjecture-e-all-cases-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  exact-trace-formula:
    name: Exact verifiers (Thm 22 n=3..6, C3 SDP & exact optima, Thm 13b, N=4..5 42-orbit certs)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install NumPy and SymPy
        run: python -m pip install --quiet numpy==2.0.2 sympy==1.14.0
      - name: Run universal cubic-trace identity & Table 8 checks for n=3..5 (97 checks)
        run: |
          python scripts/conjecture_e_trace_formula.py | tee results/ci-conjecture-e-trace-formula.log
          tail -1 results/ci-conjecture-e-trace-formula.log | grep -q "97 of 97 checks passed"
          git diff --exit-code -- results/conjecture_e_trace_formula.json
      - name: Run universal cubic-trace identity & Table 8 checks for n=6 (39 checks)
        run: |
          python scripts/conjecture_e_trace_formula.py 6 | tee results/ci-conjecture-e-trace-formula-n6.log
          tail -1 results/ci-conjecture-e-trace-formula-n6.log | grep -q "39 of 39 checks passed"
          git diff --exit-code -- results/conjecture_e_trace_formula_n6.json
      - name: Run exact four-qubit C3 QUBO SDP-dual verification (15 checks)
        run: |
          python scripts/c3_sdp_dual_check.py | tee results/ci-c3-sdp-dual-check.log
          tail -1 results/ci-c3-sdp-dual-check.log | grep -q "15 of 15 checks passed"
          git diff --exit-code -- results/c3_sdp_dual_check.json
      - name: Run exact four-qubit C3 global binary optima verification (10 checks)
        run: |
          python scripts/c3_exact_optima_check.py | tee results/ci-c3-exact-optima-check.log
          tail -1 results/ci-c3-exact-optima-check.log | grep -q "10 of 10 checks passed"
          git diff --exit-code -- results/c3_exact_optima_check.json
      - name: Run infinite pure-CCZ determinant family verification (32 checks)
        run: |
          python scripts/norm_phase_family.py | tee results/ci-norm-phase-family.log
          tail -1 results/ci-norm-phase-family.log | grep -q "32 of 32 checks passed"
          git diff --exit-code -- results/norm_phase_family.json
      - name: Run exact N=4..5 degrees, ladders & 42-orbit pure-integer verification (9 checks)
        run: |
          python scripts/exact_degrees_n4_n5.py | tee results/ci-exact-degrees-n4-n5.log
          tail -1 results/ci-exact-degrees-n4-n5.log | grep -q "9 of 9 checks passed"
          git diff --exit-code -- results/exact_degrees_n4_n5.json

  lean-formalization-audit:
    name: Lean 4.35.0 kernel - all v1.5.0-v1.8.0 modules (100 audited axioms)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the pinned Lean environment
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Retrieve pinned Mathlib dependencies
        working-directory: lean
        run: |
          lake exe cache get Mathlib.Analysis.Matrix.Spectrum \
            Mathlib.Algebra.Order.Chebyshev Mathlib.Data.ZMod.Basic Mathlib.Tactic \
            Mathlib.LinearAlgebra.Matrix.Charpoly.Basic Mathlib.LinearAlgebra.Matrix.Kronecker \
            Mathlib.LinearAlgebra.Matrix.Trace Mathlib.LinearAlgebra.Matrix.Block \
            Mathlib.FieldTheory.Finite.GaloisField Mathlib.FieldTheory.Finite.Trace
          git diff --exit-code -- lean-toolchain lake-manifest.json
      - name: Build all v1.5.0-v1.8.0 Lean modules
        working-directory: lean
        run: |
          mkdir -p ../results
          lake build HoggarBound.Kramers HoggarBound.SaturationTheory \
            HoggarBound.ConjectureE HoggarBound.ConjectureEExtras HoggarBound.AuditUpgrades \
            HoggarBound.C3ExactOptima HoggarBound.SaturatedPhaseSix \
            HoggarBound.NormPhaseFamily HoggarBound.ExactDegreesN4N5 2>&1 | tee ../results/ci-lean-new-formalizations-build.log
      - name: Run VerifyNewFormalizations.lean axiom audit
        working-directory: lean
        run: |
          set -o pipefail
          lake env lean VerifyNewFormalizations.lean 2>&1 | tee ../results/ci-lean-new-formalizations-axioms.log
      - name: Enforce standard axiom allowlist and zero forbidden constructs
        run: |
          python3 - <<'PY'
          import pathlib, re
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          source = pathlib.Path("lean/VerifyNewFormalizations.lean").read_text(encoding="utf-8")
          expected = set(re.findall(r"#print axioms\s+(\S+)", source))
          assert len(expected) == 100, f"Expected 100 audited declarations, found {len(expected)}"
          required = {
              "HoggarBound.hoggar_bound_quaternionic",
              "HoggarBound.saturation_tfae",
              "HoggarBound.saturation_mul_isSquare",
              "HoggarBound.ConjectureE.trace_completion_cube_universal",
              "HoggarBound.ConjectureE.jonah_conjecture_e_all_nine_cases",
              "HoggarBound.ConjectureE.corollary18_c11_from_c3",
              "HoggarBound.ConjectureE.corollary16_binary_minima_differ",
              "HoggarBound.AuditUpgrades.full_space_fraction_tendsto_half",
              "HoggarBound.AuditUpgrades.proposition3_violated_iff",
              "HoggarBound.AuditUpgrades.proposition8_flat_state_qgt",
              "HoggarBound.AuditUpgrades.proposition10_two_character_sum",
              "HoggarBound.AuditUpgrades.clifford_transport_strict_law_fails",
              "HoggarBound.AuditUpgrades.jonah_conjecture_e_all_nine_cases_spectra",
              "HoggarBound.AuditUpgrades.corollary16_sigmaB_sdp_lower",
              "HoggarBound.AuditUpgrades.corollary16_binary_minima_tightened",
              "HoggarBound.C3ExactOptima.corollary16_sigmaA_exact_lower",
              "HoggarBound.C3ExactOptima.corollary16_sigmaB_exact_lower",
              "HoggarBound.C3ExactOptima.corollary16_exact_binary_optima",
              "HoggarBound.det6_card",
              "HoggarBound.det6_contexts",
              "HoggarBound.det6_degree",
              "HoggarBound.NormPhaseFamily.detPhase_isFlatState",
              "HoggarBound.NormPhaseFamily.infinite_nonclosed_saturated_family",
              "HoggarBound.NormPhaseFamily.infinite_nonclosed_family_contextual",
              "HoggarBound.ExactDegreesN4N5.transv_violatedLines_eq",
              "HoggarBound.ExactDegreesN4N5.q7minus_css_witness",
              "HoggarBound.ExactDegreesN4N5.w72_css_witness",
              "HoggarBound.ExactDegreesN4N5.q9plus_css_witness",
              "HoggarBound.ExactDegreesN4N5.w72_ge_1455",
              "HoggarBound.ExactDegreesN4N5.q9plus_ge_6444",
              "HoggarBound.ExactDegreesN4N5.exact_degrees_n4_n5_of_q7minus_315",
          }
          assert required <= expected, f"Missing required declarations: {required - expected}"
          log = pathlib.Path("results/ci-lean-new-formalizations-axioms.log").read_text(encoding="utf-8")
          assert "error:" not in log and "sorry" not in log
          flat = re.sub(r"\s+", " ", log)
          found = dict(re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]", flat))
          found.update((name, "") for name in re.findall(r"'([^']+)' does not depend on any axioms", flat))
          assert expected <= found.keys(), f"Missing axiom reports: {expected - found.keys()}"
          for name in sorted(expected):
              actual = {a.strip() for a in found[name].split(",") if a.strip()}
              assert actual <= allowed, f"Unexpected axioms in {name}: {actual - allowed}"
          strict_files = [
              "lean/HoggarBound/Kramers.lean",
              "lean/HoggarBound/SaturationTheory.lean",
              "lean/HoggarBound/ConjectureECore.lean",
              "lean/HoggarBound/ConjectureECones.lean",
              "lean/HoggarBound/ConjectureE.lean",
              "lean/HoggarBound/ConjectureEExtras.lean",
              "lean/HoggarBound/AuditUpgrades.lean",
              "lean/HoggarBound/C3ExactOptimaData.lean",
              "lean/HoggarBound/NormPhaseFamily.lean",
              "lean/VerifyNewFormalizations.lean",
          ]
          kernel_eval_files = [
              "lean/HoggarBound/C3ExactOptima.lean",
              "lean/HoggarBound/SaturatedPhaseSix.lean",
              "lean/HoggarBound/ExactDegreesN4N5.lean",
          ]
          for rel in strict_files + kernel_eval_files:
              code = re.sub(r"/-.*?-/", "", pathlib.Path(rel).read_text(encoding="utf-8"), flags=re.S)
              code = re.sub(r"--.*", "", code)
              words = ("sorry", "admit", "native_decide", "unsafe", "set_option") if rel in strict_files else ("sorry", "admit", "native_decide", "unsafe")
              for word in words:
                  assert not re.search(rf"\b{word}\b", code), f"Forbidden {word} in {rel}"
              assert not re.search(r"^\s*axiom\b", code, flags=re.M), f"Custom axiom in {rel}"
          print(f"PASS: All {len(expected)} audited theorems verified strictly within {sorted(allowed)}.")
          PY
      - name: Preserve Lean evidence logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f4646cd9 # v7
        with:
          name: conjecture-e-all-cases-lean-evidence
          path: results/ci-lean-new-formalizations-*.log
          if-no-files-found: error
          retention-days: 30
