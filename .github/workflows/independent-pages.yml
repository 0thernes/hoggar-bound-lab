name: Publish independent research companion

on:
  workflow_run:
    workflows: [Independent verification]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: independent-research-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Prepare the reviewed static artifacts
        run: python3 scripts/independent_site.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/independent-site
      - name: Check that this snapshot is still the main revision
        id: current_revision
        shell: bash
        run: |
          checked_commit=$(git rev-parse HEAD)
          main_commit=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ -z "$main_commit" ]; then
            echo "Could not establish the current main revision."
            exit 1
          fi
          if [ "$checked_commit" = "$main_commit" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping superseded snapshot $checked_commit; main is $main_commit."
          fi
      - name: Publish the checked snapshot
        id: deployment
        if: steps.current_revision.outputs.publish == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
